services:
  # ─── PostgreSQL Database ───────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: ticketingflow_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ticketingflow_db
      POSTGRES_USER: laravel
      POSTGRES_PASSWORD: laravel_secret
    ports:
      - "15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - ticketingflow_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U laravel -d ticketingflow_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Laravel Backend ────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ticketingflow_backend
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor   # Named volume: vendor dikelola Docker
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ticketingflow_net
    command: >
      sh -c "composer install --optimize-autoloader --no-interaction &&
             php artisan config:clear &&
             php artisan serve --host=0.0.0.0 --port=8000"

  # ─── React Frontend ─────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ticketingflow_frontend
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules   # Isolasi node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - ticketingflow_net

# ─── Volumes Persisten ────────────────────────────────────────────────────────
volumes:
  pgdata:
    driver: local
  backend_vendor:
    driver: local

# ─── Internal Network ─────────────────────────────────────────────────────────
networks:
  ticketingflow_net:
    driver: bridge
